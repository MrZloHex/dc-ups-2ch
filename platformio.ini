; DC-UPS-2CH - ESP32 backup power controller for network gear
; https://github.com/MrZloHex/dc-ups-2ch
;
; Firmware fits in Arduino-ESP32 core only - no external libraries needed.
; Platform is pinned to 6.x to keep the watchdog / RTC-GPIO APIs stable.

[env:esp32dev]
platform      = espressif32@^6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
    -DCORE_DEBUG_LEVEL=0
    -Wall
