; DC-UPS-2CH - ESP32 backup power controller for network gear
; https://github.com/MrZloHex/dc-ups-2ch
;
; Firmware fits in Arduino-ESP32 core only - no external libraries needed.
; Platform is pinned to 6.x to keep the watchdog / RTC-GPIO APIs stable.
;
; The `native` env below only exists for `pio test -e native` (unit tests for
; the pure logic in boot_flow.cpp). Restricting default_envs keeps `pio run`
; and CI happy — otherwise it tries to link a program with no main().

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32@^6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
    -DCORE_DEBUG_LEVEL=0
    -Wall
extra_scripts = pre:scripts/inject_version.py

; Native env for `pio test -e native` — pure logic only, no Arduino / WiFi.
; Covers boot_flow.cpp: decideBootAction, canPowerLoadsOnBoot,
; shouldArmLvdAtBoot, battStateOf, pickRecoveryTarget, canChannelBeOn.
[env:native]
platform       = native
test_framework = unity
test_build_src = yes
build_src_filter = +<boot_flow.cpp>
build_flags    =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
