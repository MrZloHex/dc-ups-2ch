; ИБП-контроллер на ESP32 (DevKit V1 / ESP-WROOM-32, USB-C, CH340)
; Уведомления через ntfy.sh, управление через веб-страницу по IP.
; Внешних библиотек не нужно — всё в Arduino-фреймворке ESP32.
; Платформа закреплена на 6.x ради совместимости watchdog API.

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
