<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153f37">
  <meta name="description" content="DC-UPS-2CH technical documentation, user manual, service information and firmware resources.">
  <meta property="og:title" content="DC-UPS-2CH — Technical documentation">
  <meta property="og:description" content="Technical documentation, user manual and service information for the dual-channel ROUTER / ONT backup power supply.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mrzlohex.github.io/dc-ups-2ch/">
  <meta property="og:image" content="https://raw.githubusercontent.com/MrZloHex/dc-ups-2ch/master/hardware/enclosure/renders/exploded-front.png">
  <title>DC-UPS-2CH — Documentation</title>

  <style>
    :root {
      --bg: #f3f5f4;
      --surface: #ffffff;
      --text: #161b19;
      --muted: #5f6965;
      --line: #cfd6d3;
      --line-dark: #aeb9b5;
      --accent: #153f37;
      --accent-soft: #e9efed;
      --warning-bg: #f6f3e8;
      --warning-line: #b9a66f;
      --figure-bg: #fafcfb;
      --max: 1040px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter, "IBM Plex Sans", "Segoe UI", Arial, Helvetica, sans-serif;
      line-height: 1.5;
      font-size: 15px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .container {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
    }

    /* Header */

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line-dark);
    }

    .header-bar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
    }

    .project-id {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-width: 0;
    }

    .project-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .055em;
      white-space: nowrap;
    }

    .project-meta {
      color: var(--muted);
      font-size: 12px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      white-space: nowrap;
    }

    .lang-switch {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line-dark);
      background: var(--surface);
      min-width: 92px;
    }

    .lang-btn {
      border: 0;
      border-right: 1px solid var(--line-dark);
      background: transparent;
      color: var(--muted);
      padding: 7px 11px;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      cursor: pointer;
    }

    .lang-btn:last-child { border-right: 0; }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .hero {
      padding: 46px 0 42px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 56px);
      line-height: .98;
      letter-spacing: -.035em;
      font-weight: 850;
    }

    .subtitle {
      max-width: 760px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 19px);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid var(--accent);
      font-weight: 750;
      font-size: 14px;
      letter-spacing: .01em;
    }

    .button.primary {
      background: var(--accent);
      color: #fff;
    }

    .button.secondary {
      background: var(--surface);
      color: var(--accent);
    }

    /* Main */

    main {
      padding: 34px 0 54px;
    }

    .section {
      margin-top: 34px;
    }

    .section:first-child {
      margin-top: 0;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 9px;
      margin-bottom: 0;
      border-bottom: 1px solid var(--line-dark);
    }

    .section-heading h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .section-index {
      color: var(--muted);
      font-size: 11px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    /* Figures grid */

    .figures {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .figure {
      padding: 18px 20px 20px;
    }

    .figure + .figure {
      border-left: 1px solid var(--line);
    }

    .figure-code {
      color: var(--accent);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      margin-bottom: 10px;
    }

    .figure img {
      display: block;
      width: 100%;
      height: auto;
      background: var(--figure-bg);
      border: 1px solid var(--line);
    }

    .figure figcaption {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.5;
    }

    /* Documents list */

    .resource-list {
      background: var(--surface);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .resource {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 20px;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .resource-code {
      color: var(--accent);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .resource h3 {
      margin: 0 0 3px;
      font-size: 16px;
      font-weight: 780;
    }

    .resource p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      max-width: 720px;
    }

    .resource-link {
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .resource.primary {
      background: #f8fbfa;
      border-left: 3px solid var(--accent);
      padding-left: 18px;
    }

    /* Reference grid */

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .data-block {
      padding: 20px;
    }

    .data-block + .data-block {
      border-left: 1px solid var(--line);
    }

    .data-block h3 {
      margin: 0 0 13px;
      font-size: 14px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .spec-table {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto;
      border-top: 1px solid var(--line);
    }

    .spec-table div {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .spec-table div:nth-child(odd) {
      color: var(--muted);
      padding-right: 18px;
    }

    .spec-table div:nth-child(even) {
      text-align: right;
      font-weight: 700;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      background: var(--accent-soft);
      border: 1px solid #d7e1de;
      padding: 1px 4px;
      font-size: .92em;
    }

    .warning {
      margin-top: 22px;
      border: 1px solid var(--warning-line);
      border-left: 4px solid #8a7644;
      background: var(--warning-bg);
      padding: 14px 16px;
      font-size: 13px;
    }

    .warning-title {
      display: block;
      margin-bottom: 4px;
      font-weight: 850;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    footer {
      border-top: 1px solid var(--line-dark);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
    }

    .footer-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    @media (max-width: 760px) {
      .container {
        width: min(var(--max), calc(100% - 22px));
      }

      .header-bar {
        align-items: flex-start;
        padding: 14px 0;
      }

      .project-id {
        flex-direction: column;
        gap: 2px;
      }

      .hero {
        padding: 34px 0 32px;
      }

      .figures {
        grid-template-columns: 1fr;
      }

      .figure + .figure {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .resource {
        grid-template-columns: 58px minmax(0, 1fr);
        gap: 12px;
      }

      .resource-link {
        grid-column: 2;
        justify-self: start;
      }

      .data-grid {
        grid-template-columns: 1fr;
      }

      .data-block + .data-block {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
        padding: 18px 0;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101412;
        --surface: #161b19;
        --text: #edf1ef;
        --muted: #9ea8a4;
        --line: #2a332f;
        --line-dark: #3a4742;
        --accent: #7cae9f;
        --accent-soft: #1d2925;
        --warning-bg: #292518;
        --warning-line: #6f623e;
        --figure-bg: #0f1613;
      }

      .button.primary {
        background: #dfeae6;
        color: #143c34;
      }

      .resource.primary {
        background: #17221e;
      }

      code {
        border-color: #30423b;
      }
    }
  </style>
</head>

        <span class="project-meta" id="project-meta">ESP32 / HW v2.1 / FW v6</span>
      </div>

      <div class="lang-switch" aria-label="Language">
        <button id="lang-en" class="lang-btn active" type="button" onclick="setLanguage('en')">EN</button>

    <div class="hero">

</header>

      <article class="resource">

  </section>

  <section class="section">

    <div class="data-grid">

      <div class="data-block">

          <div data-i18n="input"></div>
          <div>230 V AC / 50 Hz</div>

          <div data-i18n="battery"></div>
          <div>12 V / 7 Ah AGM</div>

          <div data-i18n="charge"></div>
          <div>13.8 V / max 1.5 A</div>

          <div data-i18n="channels"></div>
          <div>ROUTER + ONT</div>

          <div data-i18n="controller"></div>
          <div>ESP32</div>
        </div>
      </div>
    </div>

    <div class="warning">
      <span class="warning-title" data-i18n="safetyTitle"></span>
      <span data-i18n="safetyText"></span>
    </div>
  </section>

</main>

<footer>
  <div class="container footer-inner">
    <span data-i18n="footer"></span>

      <a href="https://github.com/MrZloHex/dc-ups-2ch/blob/master/README.md">README</a>

</footer>

function setLanguage(lang) {
  if (!translations[lang]) lang = "en";
  const t = translations[lang];

  document.documentElement.lang = lang;
  document.title = t.pageTitle;

  const metaDescription = document.querySelector('meta[name="description"]');
  if (metaDescription) metaDescription.setAttribute("content", t.description || metaDescription.getAttribute("content"));

  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.dataset.i18n;
    if (Object.prototype.hasOwnProperty.call(t, key)) {
      el.textContent = t[key];
    }
  });

  // Route PDF links to the language-appropriate variant. Russian keeps the
  // canonical filenames (DC_UPS_*_v6.pdf); English is the `_en` variant.
  const suffix = lang === "ru" ? "" : "_en";
  const manualHref   = `DC_UPS_user_manual_v6${suffix}.pdf`;
  const passportHref = `DC_UPS_documentation_v6${suffix}.pdf`;
  const heroManual   = document.getElementById("hero-manual");
  const heroPassport = document.getElementById("hero-passport");
  const docManual    = document.getElementById("doc-manual");
  const docPassport  = document.getElementById("doc-passport");
  if (heroManual)   heroManual.href   = manualHref;
  if (heroPassport) heroPassport.href = passportHref;
  if (docManual)    docManual.href    = manualHref;
  if (docPassport)  docPassport.href  = passportHref;

  document.getElementById("lang-en").classList.toggle("active", lang === "en");
  document.getElementById("lang-ru").classList.toggle("active", lang === "ru");

  document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
  document.getElementById("lang-ru").setAttribute("aria-pressed", String(lang === "ru"));

  try {
    localStorage.setItem("dc-ups-language", lang);
  } catch (_) {}
}

let initialLanguage = "en";
try {
  const saved = localStorage.getItem("dc-ups-language");
  if (saved === "en" || saved === "ru") {
    initialLanguage = saved;
  }
} catch (_) {}

setLanguage(initialLanguage);

// Stamp the header from docs/build_info.json (regenerated by `make docs`).
// Falls back silently to the value baked into the DOM if the JSON is missing.
fetch("build_info.json", { cache: "no-cache" })
  .then((r) => (r.ok ? r.json() : null))
  .then((info) => {
    if (!info) return;
    const meta = document.getElementById("project-meta");
    if (!meta) return;
    const hw = info.hw     || "";
    const fw = info.fw     || "";
    const c  = info.commit || "";
    meta.textContent = `ESP32 / HW ${hw} / FW ${fw}${c ? " / " + c : ""}`;
    meta.title = `build ${info.date || ""}  commit ${c}  docrev ${info.docrev || ""}`;
  })
  .catch(() => {});
</script>
